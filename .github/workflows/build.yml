name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Build TRÊN Windows thật, không cross-compile từ Linux.
    # Cross-compile vẫn ra file chạy được, nhưng bản artifact mà người dùng tải về
    # nên được sinh trên đúng nền tảng đích để loại trừ hẳn nhóm lỗi khác biệt môi trường.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # BASS là phần mềm độc quyền, không nằm trong git — phải tải lúc build.
      # Dùng PowerShell vì runner Windows không có bash sẵn cho script .sh.
      - name: Tải native lib của BASS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/win-x64 | Out-Null
          $packages = @{
            'bass24'       = 'x64/bass.dll'
            'bassflac24'   = 'x64/bassflac.dll'
            'basswasapi24' = 'x64/basswasapi.dll'
            'bassmix24'    = 'x64/bassmix.dll'
          }
          foreach ($name in $packages.Keys) {
            $zip = "$env:RUNNER_TEMP/$name.zip"
            Invoke-WebRequest "https://www.un4seen.com/files/$name.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/$name" -Force
            Copy-Item "$env:RUNNER_TEMP/$name/$($packages[$name])" native/win-x64/
          }
          Get-ChildItem native/win-x64

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Cadence.Core không phụ thuộc UI lẫn BASS nên test chạy ở đâu cũng được.
      # Đặt ngay sau build và TRƯỚC publish: một lỗi logic hàng đợi thì không
      # đáng đóng gói ra artifact.
      - name: Test
        run: dotnet test tests/Cadence.Core.Tests/Cadence.Core.Tests.csproj --no-build -c Release

      # --self-contained true: bản cài phải chạy được trên máy trắng. Bản
      # framework-dependent nhẹ hơn ~70MB nhưng đòi máy đích cài sẵn .NET 10
      # Runtime, và "tải về, cài, không chạy được" là trải nghiệm tệ nhất có thể.
      - name: Publish win-x64
        run: >-
          dotnet publish src/Cadence.App -c Release -r win-x64
          --self-contained true -o dist

      # Bảo hiểm cho bug đã từng dính: bản build thiếu bass.dll vẫn "thành công"
      # rồi crash lúc chạy. Kiểm luôn ở CI thay vì để người dùng phát hiện.
      - name: Kiểm tra native lib đã được đóng gói
        shell: pwsh
        run: |
          $required = @('bass.dll', 'bassflac.dll', 'bassmix.dll', 'basswasapi.dll', 'Cadence.exe')
          $missing = $required | Where-Object { -not (Test-Path "dist/$_") }
          if ($missing) { throw "Bản publish thiếu: $($missing -join ', ')" }
          if (Get-ChildItem dist -Filter *.dylib) { throw "Có .dylib của macOS lọt vào bản Windows" }
          Write-Host "OK — native lib đầy đủ và đúng nền tảng"

      - name: Đóng gói bộ cài
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Không tìm thấy Inno Setup 6 ở $iscc." }

          & $iscc installer\Cadence.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC thoát với mã $LASTEXITCODE." }

      # Đưa lên release thay vì artifact của Actions. Quota artifact dùng chung
      # cho cả tài khoản (500MB gói Free) và một bản publish self-contained đủ
      # lớn để vài lần chạy là hết — lúc đó bước upload đỏ và kéo cả job đỏ theo.
      # Asset của release không tính vào quota đó và cho link tải cố định.
      - name: Đóng gói bản portable
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "dist/*" -DestinationPath "artifacts/cadence-win-x64-portable.zip" -Force

      - name: Phát hành bản build mới nhất
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-latest'

          # Tạo lại chứ không cập nhật: một asset cũ còn sót lại dưới cùng tên
          # còn tệ hơn là không có asset nào, vì nó trông như bản mới.
          gh release delete $tag --repo ${{ github.repository }} --yes --cleanup-tag 2>$null

          gh release create $tag `
            --repo ${{ github.repository }} `
            --title "Bản build mới nhất" `
            --notes "Build tự động từ ``$env:GITHUB_SHA``. Bản self-contained, không cần cài .NET." `
            --prerelease `
            "artifacts/installer/Cadence-*-setup.exe" `
            "artifacts/cadence-win-x64-portable.zip"
